
<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Konekte sou kont Valdynet Transfert ou.">
  <title>Koneksyon Kliyan | Valdynet Transfert</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Valdynet Transfert</a>
      <p class="tagline">Sevis rapid</p>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <h1>Konekte sou Kont Ou</h1>
      <p>Antre enfòmasyon ou pou jwenn espas kliyan ou.</p>
    </section>

    <section class="card">
      <form id="login-form">

        <div class="form-group">
          <label for="email">Adrès imèl</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Modpas</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Antre modpas ou"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="login-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary">
          Konekte
        </button>

      </form>

      <p>
        Ou poko gen kont?
        <a href="register.html">Kreye yon kont</a>
      </p>

      <p>
        <a href="index.html">Retounen nan paj prensipal la</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> Valdynet Transfert. Tout dwa rezève.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>

  <script>
    const loginForm = document.getElementById("login-form");
    const loginMessage = document.getElementById("login-message");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      loginMessage.textContent =
        "Sistèm koneksyon an poko konekte ak Supabase Auth. Pa gen koneksyon ki fèt.";
    });

    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
