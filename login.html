
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connectez-vous à votre compte Valdynet Transfert.">
  <title>Connexion | Valdynet Transfert</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Valdynet <span>Transfert</span></a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="transaction-section">
    <h2>Connexion à votre compte</h2>
    <p>Accédez à votre espace client pour suivre vos transactions.</p>

    <form id="login-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required>

      <button type="submit" class="primary-button">
        Se connecter
      </button>

      <p id="login-message" role="status"></p>

      <p>
        Vous n'avez pas encore de compte ?
        <a href="register.html">Créer un compte</a>
      </p>
    </form>
  </main>

  <footer>
    <p>© <span id="current-year"></span> Valdynet Transfert. Tous droits réservés.</p>
  </footer>

  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();

    document.getElementById("login-form").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("login-message").textContent =
        "Le système de connexion sera activé après la configuration du serveur.";
    });
  </script>

</body>
</html>
