
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Suivez votre transaction Valdynet Transfert."
  >

  <meta name="theme-color" content="#c62828">

  <title>Suivi de transaction | Valdynet Transfert</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">
      Valdynet <span>Transfert</span>
    </a>

    <nav aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="index.html#services">Services</a>
      <a href="login.html">Connexion</a>
    </nav>
  </header>

  <main class="transaction-section">

    <div class="container">

      <div class="page-heading">
        <h1>Suivre une transaction</h1>
        <p>
          Entrez votre numéro de transaction pour consulter son statut.
        </p>
      </div>

      <form id="track-form" novalidate>

        <div class="form-group">
          <label for="transactionId">
            Numéro de transaction
          </label>

          <input
            type="text"
            id="transactionId"
            name="transactionId"
            placeholder="Exemple : VT-XXXXXXXX"
            maxlength="80"
            autocomplete="off"
            required
          >
        </div>

        <button
          type="submit"
          class="primary-button"
          id="track-button"
        >
          Vérifier ma transaction
        </button>

        <p
          id="track-message"
          role="status"
          aria-live="polite"
        ></p>

      </form>

      <section
        id="transaction-result"
        class="card"
        hidden
        aria-live="polite"
      >

        <h2>Informations de la transaction</h2>

        <p>
          <strong>Transaction ID :</strong>
          <span id="result-id"></span>
        </p>

        <p>
          <strong>Statut :</strong>
          <span id="result-status"></span>
        </p>

        <p id="result-details"></p>

      </section>

      <p style="margin-top: 25px;">
        <a href="index.html">← Retour à l'accueil</a>
      </p>

    </div>

  </main>

  <footer class="site-footer">
    <p>
      © <span id="current-year"></span>
      Valdynet Transfert. Tous droits réservés.
    </p>
  </footer>

  <script src="assets/js/app.js"></script>

  <script>
    "use strict";

    const trackForm = document.getElementById("track-form");
    const trackInput = document.getElementById("transactionId");
    const trackMessage = document.getElementById("track-message");
    const trackButton = document.getElementById("track-button");
    const transactionResult = document.getElementById("transaction-result");

    trackForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const transactionId = trackInput.value.trim();

      transactionResult.hidden = true;
      trackMessage.textContent = "";

      if (!transactionId) {
        trackMessage.textContent =
          "Veuillez entrer votre numéro de transaction.";
        return;
      }

      if (transactionId.length < 5) {
        trackMessage.textContent =
          "Le numéro de transaction semble invalide.";
        return;
      }

      trackButton.disabled = true;
      trackButton.textContent = "Vérification...";

      trackMessage.textContent =
        "Le suivi des transactions sera activé après la connexion au serveur.";

      trackButton.disabled = false;
      trackButton.textContent = "Vérifier ma transaction";
    });
  </script>

</body>
</html>
