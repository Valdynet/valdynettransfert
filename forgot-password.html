<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mot de passe oublié – Valdynet Transfert</title>
<meta name="description" content="Réinitialisez le mot de passe de votre compte Valdynet Transfert.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="index.html">Valdynet Transfert<small>Sevis rapid</small></a></div></header>
<main class="wrap auth page" id="main">
  <div class="card">
    <h1>Mot de passe oublié</h1>
    <form id="f-reset" novalidate>
      <label><span>E-mail</span><input name="email" type="email" autocomplete="email" data-rule="email"><small class="err"></small></label>
      <p><button class="btn" type="submit">Envoyer le lien</button> <a href="index.html#auth">Retour</a></p><p class="note" role="status"></p>
    </form>
    <form id="f-newpass" novalidate hidden>
      <label><span>Nouveau mot de passe</span><input name="password" type="password" autocomplete="new-password" data-rule="password"><small class="err"></small></label>
      <label><span>Confirmer</span><input name="confirm" type="password" autocomplete="new-password" data-rule="match"><small class="err"></small></label>
      <p><button class="btn" type="submit">Enregistrer</button></p><p class="note" role="status"></p>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
