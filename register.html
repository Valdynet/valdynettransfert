
<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kreye kont ou sou Valdynet Transfert.">
  <title>Kreye Kont | Valdynet Transfert</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Valdynet Transfert</a>
      <p class="tagline">Sevis rapid</p>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <h1>Kreye Kont Ou</h1>
      <p>Enskri pou itilize sèvis Valdynet Transfert yo.</p>
    </section>

    <section class="card">
      <form id="register-form">

        <div class="form-group">
          <label for="full-name">Non konplè</label>
          <input
            type="text"
            id="full-name"
            name="fullName"
            placeholder="Antre non konplè ou"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Adrès imèl</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Nimewo telefòn</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+509..."
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Modpas</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Omwen 8 karaktè"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Konfime modpas</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Antre modpas la ankò"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <p id="register-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary">
          Kreye Kont
        </button>

      </form>

      <p>
        Ou deja gen kont?
        <a href="login.html">Konekte isit la</a>
      </p>

      <p>
        <a href="index.html">Retounen nan paj prensipal la</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> Valdynet Transfert. Tout dwa rezève.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>

  <script>
    const registerForm = document.getElementById("register-form");
    const registerMessage = document.getElementById("register-message");

    registerForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        registerMessage.textContent =
          "Modpas yo pa menm. Tanpri verifye yo.";
        return;
      }

      registerMessage.textContent =
        "Fòm enskripsyon an pare, men Supabase Auth poko konekte. Pa gen kont ki kreye.";
    });

    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
